<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>
  .title{font:900 52px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#0d3f83}
  .stepText{font:900 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#13213a;text-anchor:middle}
  .num{font:900 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}
  .arrow{font:900 58px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#1769e0;text-anchor:middle;dominant-baseline:middle}
  .footer{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#493a14}
</style>
<rect width="1200" height="720" fill="#f5f8fc"/>
<rect x="38" y="38" width="1124" height="644" rx="34" fill="#fff" stroke="#d9e5f3" stroke-width="2"/>
<text x="82" y="115" class="title">① 最初にすること</text>
<rect x="50" y="170" width="320" height="280" rx="26" fill="#f7fbff" stroke="#dbe7f5" stroke-width="2"/><circle cx="210" cy="230" r="29" fill="#1769e0"/><text x="210" y="231" class="num">1</text><text><tspan x="210" y="290" class="stepText">LINEでもらったURLを</tspan><tspan x="210" y="332" class="stepText">Safari / Chromeで開く</tspan></text><rect x="440" y="170" width="320" height="280" rx="26" fill="#f7fbff" stroke="#dbe7f5" stroke-width="2"/><circle cx="600" cy="230" r="29" fill="#1769e0"/><text x="600" y="231" class="num">2</text><text><tspan x="600" y="310" class="stepText">ホーム画面に追加</tspan></text><rect x="830" y="170" width="320" height="280" rx="26" fill="#f7fbff" stroke="#dbe7f5" stroke-width="2"/><circle cx="990" cy="230" r="29" fill="#1769e0"/><text x="990" y="231" class="num">3</text><text><tspan x="990" y="310" class="stepText">発注ナビを開く</tspan></text><text x="405" y="310" class="arrow">→</text><text x="795" y="310" class="arrow">→</text><rect x="75" y="495" width="1050" height="130" rx="22" fill="#fff7df" stroke="#f1cc73" stroke-width="2"/><text x="105" y="545" class="footer">毎回GitHubを開く必要はありません。ホーム画面の「発注ナビ」から開けます。</text></svg>